services:
  db:
    image: postgres:17-alpine
    container_name: briefme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: briefme
      POSTGRES_USER: briefme
      POSTGRES_PASSWORD: briefme
    ports:
      - "5432:5432"
    volumes:
      - briefme-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefme -d briefme"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: briefme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: briefme
      MINIO_ROOT_PASSWORD: briefme123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - briefme-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  briefme-db-data:
  briefme-minio-data:
