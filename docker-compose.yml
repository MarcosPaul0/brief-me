services:
  db:
    image: postgres:17-alpine
    container_name: briefme-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: briefme
      POSTGRES_USER: briefme
      POSTGRES_PASSWORD: briefme
    ports:
      - "5432:5432"
    volumes:
      - briefme-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefme -d briefme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  briefme-db-data:
